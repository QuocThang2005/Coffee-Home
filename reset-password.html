<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu — Coffee Home</title>
  <meta name="description" content="Đặt lại mật khẩu tài khoản Coffee Home bằng token từ email của bạn.">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page="reset-password">
<a class="skip-link" href="#main-content">Bỏ qua tới nội dung</a>

<div id="header"></div>

<main id="main-content">

  <div class="auth-wrap">
    <div class="auth-side" style="background-image:url('/images/banners/auth-side.svg')">
      <div class="auth-quote">
        <h2>Mật khẩu mới như ly mới — tươi tỉnh hẳn ra.</h2>
        <p>Coffee Home — Cà phê nhà làm, đậm đà Việt Nam.</p>
      </div>
    </div>
    <div class="auth-form-col">
      <div class="auth-form-box">
        <h1>Đặt lại mật khẩu</h1>
        <p class="sub">Token lấy từ email của bạn.</p>

        <form id="rp-form" novalidate>
          <div class="form-group" id="fg-rppass">
            <label for="rp-pass">Mật khẩu mới*</label>
            <input class="input" type="password" id="rp-pass">
            <p class="form-hint">Tối thiểu 8 ký tự, có chữ hoa và số.</p>
          </div>
          <div class="form-group" id="fg-rppass2">
            <label for="rp-confirm">Nhập lại*</label>
            <input class="input" type="password" id="rp-confirm">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="rp-submit">Cập nhật mật khẩu</button>
        </form>

        <p class="auth-alt"><a href="/login.html">Đặt xong thì đăng nhập →</a></p>
      </div>
    </div>
  </div>

</main>

<div id="footer"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
