# ============================================
# Coffee Home — Nginx Production Config
# cp nginx-coffee.conf /etc/nginx/sites-enabled/coffee-home.conf
# systemctl reload nginx
# ============================================

upstream coffee_backend {
    server backend:8010;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name coffeehome.vn www.coffeehome.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name coffeehome.vn www.coffeehome.vn;

    # ---- SSL (Let's Encrypt) ----
    ssl_certificate     /etc/letsencrypt/live/coffeehome.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffeehome.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- Security headers ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ---- Frontend static (dist/) ----
    root /var/www/coffee_home/dist;
    index index.html;

    # Static assets with long cache (hashed filenames from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images (non-hashed, shorter cache)
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # QR table images
    location /images/qr-tables/ {
        expires 90d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Uploaded files (from uploads volume shared with backend)
    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Vendor fonts/css (FA)
    location /vendor/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # config.json (minimal cache)
    location = /config.json {
        expires 1h;
        try_files $uri =404;
    }

    # ---- API → backend ----
    location /api/ {
        proxy_pass http://coffee_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ---- WebSocket → backend ----
    location /ws/ {
        proxy_pass http://coffee_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Block dotfiles ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- Block access to data/ and db files ----
    location ~* \.(db|sqlite)$ {
        deny all;
    }

    access_log /var/log/nginx/coffee-home-access.log;
    error_log  /var/log/nginx/coffee-home-error.log;
}
