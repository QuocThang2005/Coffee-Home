<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu — Coffee Home</title>
  <meta name="description" content="Quên mật khẩu tài khoản Coffee Home? Nhập email để nhận link đặt lại mật khẩu.">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page="forgot-password">
<a class="skip-link" href="#main-content">Bỏ qua tới nội dung</a>

<div id="header"></div>

<main id="main-content">

  <div class="auth-wrap">
    <div class="auth-side" style="background-image:url('/images/banners/auth-side.svg')">
      <div class="auth-quote">
        <h2>Quên mật khẩu không sao — cà phê vẫn nóng.</h2>
        <p>Coffee Home — Cà phê nhà làm, đậm đà Việt Nam.</p>
      </div>
    </div>
    <div class="auth-form-col">
      <div class="auth-form-box">
        <h1>Quên mật khẩu?</h1>
        <p class="sub">Nhập email, quán gửi link đặt lại cho bạn.</p>

        <div class="divider-or">hoặc</div>

        <form id="fp-form" novalidate>
          <div class="form-group" id="fg-femail">
            <label for="fp-email">Email đã đăng ký*</label>
            <input class="input" type="email" id="fp-email">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="fp-submit">Gửi link đặt lại mật khẩu</button>
        </form>

        <div class="text-center mt-3" id="fp-done" hidden>
          <i class="fa-solid fa-envelope-circle-check" style="font-size:3rem;color:var(--c-success)"></i>
          <p>Kiểm tra hộp thư nhé! Link có hiệu lực 30 phút.</p>
        </div>

        <p class="auth-alt"><a href="/login.html">← Về trang đăng nhập</a></p>
      </div>
    </div>
  </div>

</main>

<div id="footer"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
