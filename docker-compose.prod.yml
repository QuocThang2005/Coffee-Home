version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: coffee-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffee_home
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coffee123}
      TZ: Asia/Ho_Chi_Minh
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh", "-c", "log_timezone=Asia/Ho_Chi_Minh"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_home"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./coffee_backend
      dockerfile: Dockerfile
    container_name: coffee-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://coffee:${DB_PASSWORD:-coffee123}@postgres:5432/coffee_home
      COFFEE_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@coffeehome.vn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://coffeehome.vn,https://www.coffeehome.vn}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8010"

  nginx:
    image: nginx:1.25-alpine
    container_name: coffee-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx-coffee.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/var/www/coffee_home/dist:ro
      - uploads:/var/www/coffee_home/uploads:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: coffee-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  uploads:
