<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản — Coffee Home</title>
  <meta name="description" content="Quản lý hồ sơ, đơn hàng, lịch đặt bàn, điểm tích luỹ và địa chỉ của bạn tại Coffee Home.">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page="account">
<a class="skip-link" href="#main-content">Bỏ qua tới nội dung</a>

<div id="header"></div>

<main id="main-content">

  <!-- Page hero -->
  <section class="page-hero">
    <div class="container">
      <h1>Tài khoản của tôi</h1>
    </div>
  </section>

  <!-- Nội dung tài khoản -->
  <section class="section">
    <div class="container">
      <div class="points-card mb-3">
        <div>
          <small>Xin chào,</small>
          <h2 id="acc-hi" style="font-size:1.5rem;margin:0">Khách</h2>
        </div>
        <div style="text-align:right">
          <small>Điểm tích luỹ</small>
          <div class="pt-num" id="acc-points-num">0</div>
        </div>
      </div>

      <nav class="tabs">
        <button class="tab-btn on" type="button" data-tab="profile"><i class="fa-solid fa-user"></i> Hồ sơ</button>
        <button class="tab-btn" type="button" data-tab="orders"><i class="fa-solid fa-receipt"></i> Đơn hàng</button>
        <button class="tab-btn" type="button" data-tab="bookings"><i class="fa-solid fa-chair"></i> Đặt bàn</button>
        <button class="tab-btn" type="button" data-tab="points"><i class="fa-solid fa-gift"></i> Điểm &amp; đổi quà</button>
        <button class="tab-btn" type="button" data-tab="addresses"><i class="fa-solid fa-location-dot"></i> Địa chỉ</button>
      </nav>

      <div class="tab-pane on" id="tab-profile">
        <div class="panel">
          <form id="profile-form" novalidate style="max-width:520px">
            <div class="form-group">
              <label for="pf-name">Họ tên</label>
              <input class="input" id="pf-name" type="text">
            </div>
            <div class="form-group">
              <label for="pf-email">Email</label>
              <input class="input muted" id="pf-email" type="email" disabled readonly>
            </div>
            <div class="form-group">
              <label for="pf-phone">Số điện thoại</label>
              <input class="input" id="pf-phone" type="tel">
            </div>
            <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
          </form>
        </div>
      </div>

      <div class="tab-pane" id="tab-orders">
        <div class="panel">
          <div class="table-wrap" id="orders-list"></div>
        </div>
      </div>

      <div class="tab-pane" id="tab-bookings">
        <div class="panel">
          <div class="table-wrap" id="bookings-list"></div>
        </div>
      </div>

      <div class="tab-pane" id="tab-points">
        <div class="panel">
          <p>Cách tích điểm: mỗi 10.000₫ = 1 điểm. 500 điểm đổi 1 nước miễn phí bất kỳ, 250 điểm đổi topping.</p>
          <div class="table-wrap" id="points-history"></div>
        </div>
      </div>

      <div class="tab-pane" id="tab-addresses">
        <div class="panel">
          <div class="grid-cards" id="address-list"></div>
        </div>
      </div>

      <div class="map-frame mt-3">
        <div id="acc-map"></div>
      </div>
    </div>
  </section>

</main>

<div id="footer"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
